<svg width="1024" height="1024" viewBox="140 140 744 744" fill="none" xmlns="http://www.w3.org/2000/svg">
<!--
  托盘（菜单栏）图标源文件。

  取自 assets/logo-switchelp-merge.svg 的 S 字形，**去掉那块黑色圆角方块底**：
  菜单栏图标是一个「模板图」（template image），macOS 只按像素的 alpha 来决定哪里着色，
  颜色由系统按菜单栏明暗给（浅色菜单栏画黑、深色菜单栏画白），所以源图必须是
  「透明底 + 单色字形」，带底的方块会变成一块死黑的色块。

  viewBox 收在字形外接框上（原图里 S 占 x 180.85–843.15、y 180.06–843.94），
  否则字形只占画布的 65%，缩到 18pt 的菜单栏里会显得比邻居小一圈。
-->
