[workspace]
resolver = "2"
members = ["crates/switch-core", "crates/bridge", "src-tauri"]

[workspace.package]
version = "0.3.3"
edition = "2021"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util", "fs"] }
tracing = "0.1"

[profile.release]
lto = "thin"
strip = true
