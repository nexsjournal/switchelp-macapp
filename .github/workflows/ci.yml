name: ci

# 提交与 PR 的门禁。
#
# 发布工作流只在打标签或手动触发时跑，因此不能替代这一层：没有它的话，一次回归可以一路
# 合进 main，再直接被打了标签发布出去，全程没有任何测试被执行过。
#
# 这里跑的是「改坏了会静默出错」的那几项：类型、前端单元测试、生产构建、核心测试、
# 格式与 clippy、发布前隐私扫描、工作流语法。

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: 前端（类型 + 测试 + 构建）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 类型检查
        run: pnpm typecheck
      - name: 单元测试
        run: pnpm test
      - name: 生产构建
        run: pnpm build

  core:
    name: 核心（cargo test）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          # 与 rust-toolchain.toml 一致：不固定的话 CI 装到的更新版本会报出本地没有的 lint。
          toolchain: 1.88.0
      - uses: swatinem/rust-cache@v2
        with:
          # 工作区根在仓库根目录，不是 src-tauri——写成 src-tauri 会让缓存键只看成员清单，
          # crates/switch-core 的改动不使缓存失效。
          workspaces: .
      - name: 核心测试
        run: cargo test -p switch-core

  lint:
    name: 格式与 clippy
    # 必须跑在 macOS 上：`--workspace` 会编译 src-tauri，而 Tauri 在 Linux 上需要
    # webkit2gtk / gtk 的开发库；macOS runner 自带 Xcode，省掉一串 apt 依赖。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          # 固定版本：rustfmt 的排版与 clippy 的 lint 集合都随版本变化，不固定的话
          # CI 装到的新版本会报出本地没有的 lint（本仓库的 MSRV 见 Cargo.toml 的 rust-version）。
          toolchain: 1.88.0
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: 格式
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  privacy:
    name: 发布前隐私扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 扫描脚本只依赖 git 与基础命令，任意 runner 都能跑；规则是通用的，
      # 个人私有特征放在仓库外的清单里，这里不配置也不会漏掉通用规则。
      - name: 扫描
        run: scripts/check-publish-safety.sh

  workflows:
    name: 工作流语法
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # actionlint 会抓到 YAML 解析器不会报的问题：重复的 job 名、缺失的 runs-on、
      # 表达式里引用不存在的输出。重复 key 尤其隐蔽——PyYAML 之类的解析器会静默接受。
      - uses: raven-actions/actionlint@v2
