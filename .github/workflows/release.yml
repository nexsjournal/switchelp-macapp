name: release

# 打标签即出包：macOS 与 Windows 各自在原生 runner 上构建，然后附到 Release。
#
# 为什么不在 macOS 上交叉编译 Windows：Tauri 的 Windows 安装包要 NSIS/WiX 与
# Windows SDK，交叉构建官方不支持且极易产出有问题的安装器。用原生 runner 是唯一可靠做法。
#
# 签名：macOS 需要 Developer ID 证书 + 公证凭据，Windows 需要代码签名证书。
# 没配置 secrets 时也能出包，只是产物未签名——下面的步骤会自动跳过签名而不是失败。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '把产物附加到哪个标签（留空则用当前 ref）'
        type: string
        default: 'v0.1.0'
      draft:
        description: '发布为草稿'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS (Apple Silicon)
            # 需要配 APPLE_SIGNING_IDENTITY 才会跑：未签名的 macOS 包下载后
            # 会被 Gatekeeper 拦下，发布这种东西比不发布更糟。
            requires_signing: true
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macOS (Intel)
            requires_signing: true
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows (x64)
            requires_signing: false

    runs-on: ${{ matrix.platform }}
    name: ${{ matrix.label }}
    # 未配置签名时跳过 macOS 构建，而不是产出一个用户打不开的包。
    if: ${{ !matrix.requires_signing || secrets.APPLE_SIGNING_IDENTITY != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      # --- macOS 签名与公证 ------------------------------------------------
      # 只有一个平台上做公证：两份产物共用同一套凭据，重复提交没有意义。
      - name: 准备 macOS 签名证书
        if: startsWith(matrix.platform, 'macos') && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import certificate.p12 -k build.keychain -P "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain
          rm certificate.p12

      - name: 保存公证凭据到钥匙串
        if: startsWith(matrix.platform, 'macos') && env.APPLE_API_KEY != ''
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          mkdir -p ~/private_keys
          echo "$APPLE_API_KEY" | base64 --decode > ~/private_keys/AuthKey.p8
          xcrun notarytool store-credentials gptswitch \
            --key ~/private_keys/AuthKey.p8 \
            --key-id "${{ secrets.APPLE_API_KEY_ID }}" \
            --issuer "${{ secrets.APPLE_API_ISSUER }}"

      # --- 构建 ------------------------------------------------------------
      - name: 构建（macOS）
        if: startsWith(matrix.platform, 'macos')
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # tauri 会自动用这个 profile 提交公证并 staple。
          APPLE_KEYCHAIN_PROFILE: ${{ secrets.APPLE_SIGNING_IDENTITY != '' && 'gptswitch' || '' }}
        run: pnpm exec tauri build --target ${{ matrix.target }}

      - name: 构建（Windows）
        if: matrix.platform == 'windows-latest'
        env:
          # 未配置证书时就跳过签名，仍然出包；配置后自动签名。
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: pnpm exec tauri build --target ${{ matrix.target }}

      # --- 归集产物 --------------------------------------------------------
      - name: 归集 macOS 产物
        if: startsWith(matrix.platform, 'macos')
        run: |
          mkdir -p out
          find target -maxdepth 4 -type f \( -name '*.dmg' -o -name '*.app.zip' \) -exec cp {} out/ \;
          cd target/${{ matrix.target }}/release/bundle/macos 2>/dev/null && zip -qry ../../../../../out/GPTSwitch-${{ matrix.target }}.app.zip GPTSwitch.app && cd -
          ls -la out

      - name: 归集 Windows 产物
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Get-ChildItem -Path target -Recurse -Include *.msi,*.exe |
            Where-Object { $_.FullName -notmatch 'deps|build' } |
            Copy-Item -Destination out
          Get-ChildItem out

      - uses: actions/upload-artifact@v4
        with:
          name: gptswitch-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 列出即将发布的产物
        run: ls -la artifacts

      - uses: softprops/action-gh-release@v2
        with:
          # 手动触发时可以指定要附加产物的标签；打标签时用触发它的那个标签。
          tag_name: ${{ inputs.tag || github.ref_name }}
          # 手动触发时默认草稿，核对过再发布；打标签时直接发布。
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          generate_release_notes: true
          files: artifacts/*
