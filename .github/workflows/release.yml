name: release

# 打标签（v*）自动出包；也可以在 Actions 页手动触发并指定要附加产物的标签。
#
# 为什么不在 macOS 上交叉编译 Windows：Tauri 的 Windows 安装包需要 NSIS/WiX 与
# Windows SDK，交叉构建官方不支持且极易产出有问题的安装器。用原生 runner 是唯一可靠做法。
#
# 签名：macOS 需要 Developer ID 证书（再加公证凭据才能双击打开），Windows 需要
# 另一张代码签名证书。凭据配置步骤见 docs/development/03-signing-and-release.md。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '把产物附加到哪个标签（必填，形如 v0.1.1）'
        type: string
        required: true
      draft:
        description: '发布为草稿'
        type: boolean
        default: false
      with_windows:
        # 默认只出 macOS 包：Windows 只在明确需要时打，避免每次发版都花十几分钟在
        # 用不到的安装包上（而且它还需要 Windows 签名证书才有意义）。
        description: '同时构建 Windows 包'
        type: boolean
        default: false

permissions:
  contents: read

# 两次发布（打标签与手动触发撞上、或连推两个标签）会同时写同一个 release。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 发布前先跑测试：标签构建不能把没测过的代码发出去。
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          # 固定版本：rustfmt 的排版与 clippy 的 lint 集合都随版本变化，不固定的话
          # CI 装到的新版本会报出本地没有的 lint（本仓库的 MSRV 见 Cargo.toml 的 rust-version）。
          toolchain: 1.88.0
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile
      - name: 类型与前端测试
        run: |
          pnpm typecheck
          pnpm test
      - name: 核心测试
        run: |
          cargo test -p switch-core
          cargo test -p gptswitch-bridge
      - name: 格式与 clippy
        # 这个 job 在 ubuntu 上跑：`--workspace` 会编译 src-tauri，而 Tauri 在 Linux 上
        # 需要 webkit2gtk/gtk 开发库。工作区级 clippy 放在 ci.yml 的 macOS job 里，
        # 这里只查不依赖平台的核心。
        run: |
          cargo fmt --all --check
          cargo clippy -p switch-core --all-targets -- -D warnings
      - name: 版本号一致（package.json / tauri.conf.json / Cargo.toml）
        run: |
          pkg=$(node -p "require('./package.json').version")
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo_ver=$(cargo metadata --no-deps --format-version 1 | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const m=JSON.parse(s).packages.find(p=>p.name==='switch-core');console.log(m.version)})")
          echo "package.json=$pkg tauri=$conf switch-core=$cargo_ver"
          if [ "$pkg" != "$conf" ] || [ "$conf" != "$cargo_ver" ]; then
            echo "::error::版本号不一致：三处必须同步，否则安装包与界面会报不同的版本"
            exit 1
          fi
          # 打标签触发的构建：标签必须与版本号对得上，否则发出去的包与标签名互相矛盾。
          if [ "${{ github.event_name }}" = "push" ] && [ "${GITHUB_REF_NAME}" != "v$pkg" ]; then
            echo "::error::标签 ${GITHUB_REF_NAME} 与版本 $pkg 不一致（应为 v$pkg）"
            exit 1
          fi

  # 单独一个 job 把「有没有签名身份」算成输出。
  # 不能在 job 级 `if` 里用 `matrix`（矩阵展开前就求值了），`needs` 才可以。
  gate:
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.check.outputs.signed }}
    steps:
      - id: check
        env:
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -n "$IDENTITY" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 APPLE_SIGNING_IDENTITY，跳过 macOS 构建：未签名的 macOS 包下载后会被 Gatekeeper 拦下，发布它比不发布更糟。"
          fi

  build-windows:
    needs: [gate, test]
    # 手动触发时看 with_windows；打标签触发时不出 Windows（需要时手动再触发一次）。
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.with_windows }}
    runs-on: windows-latest
    name: Windows (x64)
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          # 固定版本：rustfmt 的排版与 clippy 的 lint 集合都随版本变化，不固定的话
          # CI 装到的新版本会报出本地没有的 lint（本仓库的 MSRV 见 Cargo.toml 的 rust-version）。
          toolchain: 1.88.0
          targets: x86_64-pc-windows-msvc
      - uses: swatinem/rust-cache@v2
        with:
          # 工作区根在仓库根：写成 src-tauri 时 crates/switch-core 的改动不使缓存失效。
          workspaces: .
      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile
      - name: 构建（Windows）
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: pnpm exec tauri build --target x86_64-pc-windows-msvc
      - name: 归集产物
        shell: pwsh
        run: |
          # 只取打包产物目录：整树搜索会把未打包的裸 gptswitch.exe 也带上，
          # 那不是安装包，用户下载后会一脸问号。
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $bundle = "target/x86_64-pc-windows-msvc/release/bundle"
          Get-ChildItem -Path $bundle -Recurse -Include *.msi,*.exe |
            Copy-Item -Destination out
          if (-not (Get-ChildItem out)) { throw "没有找到任何安装包：$bundle" }
          Get-ChildItem out
      - uses: actions/upload-artifact@v4
        with:
          name: switchelp-x86_64-pc-windows-msvc
          path: out/*
          if-no-files-found: error

  # macOS 只在配置了签名身份时构建：未签名的 macOS 包下载后会被 Gatekeeper 拦下。
  # job 级 `if` 不能用 `matrix`（解析期就报错），所以这里用 `needs` 判断。
  build-macos:
    needs: [gate, test]
    if: ${{ needs.gate.outputs.signed == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-latest
    name: macOS
    env:
      # `if` 表达式里不能直接引用 secrets，只能引用 env；所以先在 job 级转存。
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          # 固定版本：rustfmt 的排版与 clippy 的 lint 集合都随版本变化，不固定的话
          # CI 装到的新版本会报出本地没有的 lint（本仓库的 MSRV 见 Cargo.toml 的 rust-version）。
          toolchain: 1.88.0
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 导入签名证书
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain
          rm certificate.p12

      - name: 保存公证凭据
        if: env.APPLE_API_KEY != ''
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          mkdir -p ~/private_keys
          echo "$APPLE_API_KEY" | base64 --decode > ~/private_keys/AuthKey.p8
          xcrun notarytool store-credentials gptswitch \
            --key ~/private_keys/AuthKey.p8 \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER"

      - name: 构建（签名并公证）
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEYCHAIN_PROFILE: gptswitch
        run: pnpm exec tauri build --target ${{ matrix.target }}

      - name: 校验签名与公证
        env:
          # `if` 里不能直接用 secrets，先转存到环境变量。
          NOTARIZATION_CONFIGURED: ${{ secrets.APPLE_API_KEY != '' && 'true' || 'false' }}
        run: |
          APP="target/${{ matrix.target }}/release/bundle/macos/Switchelp.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          if spctl --assess --type execute -vv "$APP"; then
            echo "Gatekeeper 通过"
          elif [ "$NOTARIZATION_CONFIGURED" = "true" ]; then
            # 配了公证凭据却仍被拦：这是真的坏了，不能只发一条 warning 就当成功，
            # 否则 CI 一片绿而用户双击打不开。
            echo "::error::已配置公证凭据，但 Gatekeeper 仍未通过"
            exit 1
          else
            echo "::warning::未配置公证凭据：用户首次打开需右键打开（或去掉隔离标记）。"
          fi

      - name: 归集产物
        run: |
          mkdir -p out
          find target -type f -name '*.dmg' -exec cp {} out/ \;
          ditto -c -k --keepParent "target/${{ matrix.target }}/release/bundle/macos/Switchelp.app" \
            "out/Switchelp-${{ matrix.target }}.zip"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: switchelp-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  publish:
    needs: [test, build-windows, build-macos]
    permissions:
      contents: write
    # 被跳过的依赖会让下游默认也跳过，所以这里显式判断：
    # 测试必须成功；Windows 与 macOS 各自「成功或跳过」都算（macOS 未配签名时跳过，
    # Windows 默认不出；产物由本机签名后手动附上）。
    if: ${{ always() && !cancelled()
      && needs.test.result == 'success'
      && (needs.build-windows.result == 'success' || needs.build-windows.result == 'skipped')
      && (needs.build-macos.result == 'success' || needs.build-macos.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 列出即将发布的产物
        id: collect
        run: |
          # 零产物是**预期状态之一**（macOS 未配签名时跳过、Windows 默认不出），不是失败：
          # 包由本机签名后手动附上。但**不能**让它变成一个公开可见的空 Release——
          # 那对下载者就是一句没兑现的承诺。所以这里只判断「有没有」，由下一步决定草稿与否。
          mkdir -p artifacts
          ls -la artifacts
          if [ -z "$(ls -A artifacts)" ]; then
            echo "has_artifacts=false" >> "$GITHUB_OUTPUT"
            echo "::notice::这次没有 CI 产物。Release 会以**草稿**形式创建：本机签名后的包附上来再手动发布，下载者不会看到一个空页面。"
          else
            echo "has_artifacts=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          # 手动触发时可以指定要附加产物的标签；打标签时用触发它的那个标签。
          tag_name: ${{ inputs.tag || github.ref_name }}
          # 零产物一律先成草稿：草稿对公众不可见，附上本机签名包后再发布。
          # 以前无条件按手动输入的 draft 走，于是「打标签」会直接建出一个没有任何附件的
          # 公开 Release —— 页面看起来已经发布了，点进去什么都没有。
          draft: ${{ steps.collect.outputs.has_artifacts == 'false' || (github.event_name == 'workflow_dispatch' && inputs.draft) }}
          generate_release_notes: true
          # 没有产物时不报错：见上，零产物是预期状态之一。
          fail_on_unmatched_files: false
          files: artifacts/*
          # 首次打开说明写在这一页，因为下载的人先落到这里——README 里的同名说明他可能根本不会翻。
          # 不写死版本号：正文随标签走，免得下次发版忘了改。
          body: |
            ## 首次打开（macOS）

            包已用 Developer ID 签名，但**尚未公证**，所以 macOS 会拦一次。两条路，先试第一条：

            1. **系统设置 → 隐私与安全性** → 下滚到「安全性」一栏 → 点被拦应用旁边的**仍要打开** → 输入密码确认。
               Apple 现在的官方文档已不再提「右键 → 打开」那个旧办法，右键没反应是正常的。
            2. 或者打开一次终端，执行完再正常双击：

               ```bash
               xattr -dr com.apple.quarantine /Applications/Switchelp.app
               ```

            下载后可自行核对 SHA-256（`shasum -a 256 <文件>`）；GitHub 也会在附件旁标注 digest。

            **Windows 与 Intel Mac**：自动构建目前不产出它们。原因与替代做法见
            [README 的下载与安装一节](https://github.com/nexsjournal/switchelp-macapp#download-and-install)。
